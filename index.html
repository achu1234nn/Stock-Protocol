<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stock Protocol – Mystic Summit Hackathon</title>
  <style>
    :root {
      --bg: #f5f3ee;
      --surface: #ffffff;
      --text: #1d2433;
      --muted: #5b6475;
      --accent: #2b4acb;
      --accent-text: #ffffff;
      --border: #d9d6cc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151d;
        --surface: #1b2030;
        --text: #eef0f6;
        --muted: #a2a9ba;
        --accent: #7b93ff;
        --accent-text: #10142a;
        --border: #2d3447;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      line-height: 1.6;
    }
    main {
      width: 100%;
      max-width: 600px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 44px 32px;
      text-align: center;
    }
    .brand { margin-bottom: 26px; }
    h1 {
      margin: 0;
      font-size: 2.1rem;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin: 8px 0 0;
      color: var(--accent);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .intro { margin: 0 0 26px; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .btn {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 8px;
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      background: var(--accent);
      color: var(--accent-text);
      border: 1px solid var(--accent);
    }
    .btn.secondary {
      background: transparent;
      color: var(--accent);
    }
    .btn:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <h1>Stock Protocol</h1>
      <p class="subtitle">Mystic Summit Hackathon</p>
    </div>
    <p class="intro">Open the presentation in a new tab, or download the original PPT.</p>
    <div class="actions">
      <a class="btn"
         href="https://view.officeapps.live.com/op/view.aspx?src=https%3A%2F%2Fraw.githubusercontent.com%2Fachu1234nn%2FStock-Protocol%2Fmain%2FIdea_Deck_Template.ppt"
         target="_blank"
         rel="noopener">View My Presentation</a>
      <a class="btn secondary" href="Idea_Deck_Template.ppt" download>Download PPT</a>
    </div>
  </main>
</body>
</html>
