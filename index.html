<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apex Mystic Summit – SIH Idea Deck</title>
  <style>
    :root {
      --bg: #f5f3ee;
      --surface: #ffffff;
      --text: #1d2433;
      --muted: #5b6475;
      --accent: #2b4acb;
      --accent-text: #ffffff;
      --border: #d9d6cc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151d;
        --surface: #1b2030;
        --text: #eef0f6;
        --muted: #a2a9ba;
        --accent: #7b93ff;
        --accent-text: #10142a;
        --border: #2d3447;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      line-height: 1.6;
    }
    main {
      width: 100%;
      max-width: 560px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 40px 32px;
    }
    h1 { margin: 0 0 8px; font-size: 1.75rem; line-height: 1.25; }
    p { margin: 0 0 24px; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; }
    a.btn {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      background: var(--accent);
      color: var(--accent-text);
    }
    a.btn.secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    a.btn:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Apex Mystic Summit – SIH Idea Deck</h1>
    <p>Open the presentation below. Your browser may download the file instead of showing it.</p>
    <div class="actions">
      <a class="btn" href="https://docs.google.com/presentation/d/10pKvLjZWJRBEnk8QKzXwgDsXzzHMLt-U/edit?usp=drivesdk&ouid=106836410920085645517&rtpof=true&sd=true" target="_blank" rel="noopener">View My Presentation</a>
      <a class="btn secondary" href="idea-deck.ppt" download>Download PPT</a>
    </div>
  </main>
</body>
</html>
